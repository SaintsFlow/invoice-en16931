services:
  api:
    build: .
    # Without .env the service still starts on defaults, so the gate runs on a
    # fresh clone and in CI.
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      # The whole project is mounted, so an edit shows up without a rebuild and
      # tools like the formatter can write back to your files.
      - .:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/health")
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
